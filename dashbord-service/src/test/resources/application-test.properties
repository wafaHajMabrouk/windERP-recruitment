spring.application.name=dashboard-service-test

# ? CORRECTION: Utiliser le schéma WIND_DASHBOARD
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS WIND_DASHBOARD\;SET SCHEMA WIND_DASHBOARD
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=WIND_DASHBOARD

# Désactiver Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Désactiver Feign
feign.client.config.default.connectTimeout=1000
feign.client.config.default.readTimeout=1000
feign.circuitbreaker.enabled=false

# Désactiver Security
spring.security.enabled=false