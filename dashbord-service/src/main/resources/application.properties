spring.application.name=dashboard-service
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/winderp
spring.datasource.username=postgres
spring.datasource.password=wafawafa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=wind_dashboard

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO
logging.level.com.winderp.dashboard=DEBUG