services:
  # ==================== BASE DE DONNÉES ====================
  postgres:
    image: postgres:15
    container_name: winderp-postgres
    environment:
      POSTGRES_DB: winderp_db
      POSTGRES_USER: winderp
      POSTGRES_PASSWORD: winderp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winderp -d winderp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recrute_winderp-network

  # ==================== SERVICE DISCOVERY ====================
  eureka-server:
    build: ./eureka-server
    container_name: winderp-eureka
    ports:
      - "8762:8762"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    networks:
      - recrute_winderp-network

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./api-gateway
    container_name: winderp-gateway
    ports:
      - "8082:8082"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== AUTH SERVICE ====================
  auth-service:
    build: ./Authentification
    container_name: winderp-auth
    ports:
      - "8087:8087"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: une_cle_secrete_pour_auth
      JWT_EXPIRATION: "86400000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== DASHBOARD SERVICE ====================
  dashboard-service:
    build: ./dashbord-service
    container_name: winderp-dashboard
    ports:
      - "8088:8088"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== CANDIDATE SERVICE ====================
  candidate-service:
    build: ./candidate-service
    container_name: winderp-candidate
    ports:
      - "8089:8089"
    environment:
      GEMINI_API_KEY: "dummy-key-for-testing"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== INTERVIEW SERVICE ====================
  interview-service:
    build: ./interview-service
    container_name: winderp-interview
    ports:
      - "8091:8091"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== NOTIFICATION SERVICE ====================
  notification-service:
    build: ./notificationservice
    container_name: winderp-notification
    ports:
      - "8090:8090"
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/winderp_db
      SPRING_DATASOURCE_USERNAME: winderp
      SPRING_DATASOURCE_PASSWORD: winderp123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recrute_winderp-network

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: winderp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - recrute_winderp-network

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - recrute_winderp-network

  # ==================== CADVISOR (demandé par l'encadrant) ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: winderp-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - recrute_winderp-network

networks:
  recrute_winderp-network:
    driver: bridge

volumes:
  postgres_data: