# candidate-service/src/test/resources/application-test.properties
spring.application.name=candidate-service-test

# H2 Database avec schéma WIND_RECRUTEMENT
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS WIND_RECRUTEMENT\\;SET SCHEMA WIND_RECRUTEMENT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=WIND_RECRUTEMENT

# Désactiver Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Désactiver Security
spring.security.enabled=false
spring.security.csrf.enabled=false

# Désactiver Feign
feign.client.config.default.connectTimeout=1000
feign.client.config.default.readTimeout=1000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true