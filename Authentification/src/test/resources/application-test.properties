# ===================== Profil Test =====================
spring.application.name=auth-service-test
server.port=0

# ===================== H2 Database Configuration (pour tests) =====================
# Configuration avec création du schéma wind_auth (identique à production)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS wind_auth\;SET SCHEMA wind_auth
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================== JPA / Hibernate (identique à production) =====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=wind_auth

# ===================== Désactiver Eureka pour tests =====================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ===================== JWT (clé pour tests) =====================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===================== Logging (réduit pour tests) =====================
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.winderp=WARN