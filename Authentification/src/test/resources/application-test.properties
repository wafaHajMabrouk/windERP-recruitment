# ===================== Profil Test =====================
spring.application.name=auth-service-test

# ? Auto-approve pour les tests (désactive la validation admin)
app.auth.auto-approve=true

# ===================== DataSource H2 =====================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS wind_auth\\;SET SCHEMA wind_auth
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=

# ===================== Eureka =====================
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ===================== JWT =====================
jwt.secret=TaCleTresSecreteAuMoins32CaractsTest
jwt.expiration=86400000

# ===================== Security =====================
spring.security.enabled=false
spring.security.csrf.enabled=false

# ===================== Logging =====================
logging.level.org.springframework.security=OFF
logging.level.org.hibernate=WARN