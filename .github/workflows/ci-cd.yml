          distribution: 'temurin'

      - name: Check if ApiGateway exists
        id: check_gateway
        run: |
          if [ -d "ApiGateway" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Test API Gateway
        if: steps.check_gateway.outputs.exists == 'true'
        run: |
          cd ApiGateway
          mvn clean test -DskipTests=false || true

      - name: Generate test report for API Gateway
        if: always() && steps.check_gateway.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-gateway
          path: ApiGateway/target/surefire-reports/
          retention-days: 30

  # Package uniquement les services qui existent
  package-all:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-candidate-service, test-interview-service, test-notification-service, test-dashboard-service, test-eureka-server, test-api-gateway]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package all existing services
        run: |
          for dir in */; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Packaging $dir"
              cd "$dir"
              mvn clean package -DskipTests || true
              cd ..
            fi
          done

      - name: Upload all JARs
        uses: actions/upload-artifact@v4
        with:
          name: all-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
            !*/target/*-javadoc.jar
          retention-days: 30