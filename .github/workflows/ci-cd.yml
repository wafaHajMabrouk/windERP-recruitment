          fi

      - name: Test Notification Service
        if: steps.check_notification.outputs.exists == 'true'
        run: |
          cd notification-service
          mvn clean test -DskipTests=false || true

      - name: Generate test report for Notification Service
        if: always() && steps.check_notification.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-notification-service
          path: notification-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice dashboard-service (optionnel)
  test-dashboard-service:
