name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job pour le microservice authentification
  test-authentification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Test Authentification Service
        run: |
          cd Authentification
          mvn clean test

      - name: Generate test report for Authentification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authentification
          path: Authentification/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice candidate-service
  test-candidate-service:
