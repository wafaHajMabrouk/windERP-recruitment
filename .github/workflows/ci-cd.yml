name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ==================== TESTS DES MICROSERVICES ====================

  # Job pour le microservice authentification
  test-authentification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Test Authentification Service
        run: |
          cd Authentification
          mvn clean test -DskipTests=false

      - name: Generate test report for Authentification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authentification
          path: Authentification/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice candidate-service
  test-candidate-service:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if candidate-service exists
        id: check_candidate
        run: |
          if [ -d "candidate-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test Candidate Service
        if: steps.check_candidate.outputs.exists == 'true'
        run: |
          cd candidate-service
          mvn clean test -DskipTests=false || true
      - name: Generate test report for Candidate Service
        if: always() && steps.check_candidate.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-candidate-service
          path: candidate-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice interview-service
  test-interview-service:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if interview-service exists
        id: check_interview
        run: |
          if [ -d "interview-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test Interview Service
        if: steps.check_interview.outputs.exists == 'true'
        run: |
          cd interview-service
          mvn clean test -DskipTests=false || true
      - name: Generate test report for Interview Service
        if: always() && steps.check_interview.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-interview-service
          path: interview-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice notification-service
  test-notification-service:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if notification-service exists
        id: check_notification
        run: |
          if [ -d "notification-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test Notification Service
        if: steps.check_notification.outputs.exists == 'true'
        run: |
          cd notification-service
          mvn clean test -DskipTests=false || true
      - name: Generate test report for Notification Service
        if: always() && steps.check_notification.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-notification-service
          path: notification-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice dashboard-service
  test-dashboard-service:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if dashboard-service exists
        id: check_dashboard
        run: |
          if [ -d "dashboard-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test Dashboard Service
        if: steps.check_dashboard.outputs.exists == 'true'
        run: |
          cd dashboard-service
          mvn clean test -DskipTests=false || true
      - name: Generate test report for Dashboard Service
        if: always() && steps.check_dashboard.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dashboard-service
          path: dashboard-service/target/surefire-reports/
          retention-days: 30

  # Job pour Eureka Server
  test-eureka-server:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if eureka-server exists
        id: check_eureka
        run: |
          if [ -d "eureka-server" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test Eureka Server
        if: steps.check_eureka.outputs.exists == 'true'
        run: |
          cd eureka-server
          mvn clean test -DskipTests=false || true
      - name: Generate test report for Eureka Server
        if: always() && steps.check_eureka.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-eureka-server
          path: eureka-server/target/surefire-reports/
          retention-days: 30

  # Job pour API Gateway
  test-api-gateway:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check if api-gateway exists
        id: check_gateway
        run: |
          if [ -d "api-gateway" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test API Gateway
        if: steps.check_gateway.outputs.exists == 'true'
        run: |
          cd api-gateway
          mvn clean test -DskipTests=false || true
      - name: Generate test report for API Gateway
        if: always() && steps.check_gateway.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-gateway
          path: api-gateway/target/surefire-reports/
          retention-days: 30

  # ==================== PACKAGE ALL SERVICES ====================

  package-all:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-candidate-service, test-interview-service, test-notification-service, test-dashboard-service, test-eureka-server, test-api-gateway]
    if: always()

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Package all existing services
        run: |
          for dir in */; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Packaging $dir"
              cd "$dir"
              mvn clean package -DskipTests || true
              cd ..
            fi
          done
      - name: Upload all JARs
        uses: actions/upload-artifact@v4
        with:
          name: all-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
            !*/target/*-javadoc.jar
          retention-days: 30

  # ==================== ANALYSE SONARQUBE ====================

  sonar-analysis:
    runs-on: ubuntu-latest
    needs: package-all
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Run SonarQube analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=winderp \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ==================== BUILD DOCKER IMAGES ====================

  docker-build:
    runs-on: ubuntu-latest
    needs: package-all
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-jars
          path: ./jars

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          # Authentification
          docker build -t winderp/authentification:latest ./Authentification
          docker push winderp/authentification:latest
          
          # Candidate Service
          if [ -d "candidate-service" ]; then
            docker build -t winderp/candidate-service:latest ./candidate-service
            docker push winderp/candidate-service:latest
          fi
          
          # Interview Service
          if [ -d "interview-service" ]; then
            docker build -t winderp/interview-service:latest ./interview-service
            docker push winderp/interview-service:latest
          fi
          
          # Notification Service
          if [ -d "notification-service" ]; then
            docker build -t winderp/notification-service:latest ./notification-service
            docker push winderp/notification-service:latest
          fi
          
          # Dashboard Service
          if [ -d "dashboard-service" ]; then
            docker build -t winderp/dashboard-service:latest ./dashboard-service
            docker push winderp/dashboard-service:latest
          fi
          
          # Eureka Server
          if [ -d "eureka-server" ]; then
            docker build -t winderp/eureka-server:latest ./eureka-server
            docker push winderp/eureka-server:latest
          fi
          
          # API Gateway
          if [ -d "api-gateway" ]; then
            docker build -t winderp/api-gateway:latest ./api-gateway
            docker push winderp/api-gateway:latest
          fi

  # ==================== DEPLOIEMENT ====================

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /app/windERP
            docker-compose pull
            docker-compose up -d --force-recreate
            docker system prune -f

  # ==================== NOTIFICATIONS ====================

  notify:
    runs-on: ubuntu-latest
    needs: [sonar-analysis, docker-build, deploy]
    if: always()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Pipeline CI/CD terminé!\n\n✅ Status: ${{ job.status }}\n📦 Commit: ${{ github.sha }}\n🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline CI/CD échoué"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            Le pipeline CI/CD a échoué pour le commit ${{ github.sha }}.
            Voir les détails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ==================== TESTS DE CHARGE ====================

  performance-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create load test file
        run: |
          mkdir -p tests
          cat > tests/load-test.js << 'EOF'
          import http from 'k6/http';
          import { sleep, check } from 'k6';
          
          export let options = {
            stages: [
              { duration: '30s', target: 20 },
              { duration: '1m', target: 50 },
              { duration: '30s', target: 0 },
            ],
          };
          
          export default function () {
            let res = http.get('http://localhost:8080/actuator/health');
            check(res, { 'status was 200': (r) => r.status == 200 });
            sleep(1);
          }
          EOF

      - name: Run k6 load tests
        run: |
          k6 run tests/load-test.js --out json=results.json || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: results.json
          retention-days: 30