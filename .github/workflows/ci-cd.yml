name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Permet d'annuler les runs en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  # ==================== TESTS DES MICROSERVICES ====================

  # Job pour Authentication
  test-authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('Authentification/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Authentication Service
        run: |
          cd Authentification
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authentication
          path: Authentification/target/surefire-reports/
          retention-days: 30

  # Job pour candidate-service
  test-candidate-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-candidate-${{ hashFiles('candidate-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Candidate Service
        run: |
          cd candidate-service
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-candidate-service
          path: candidate-service/target/surefire-reports/
          retention-days: 30

  # Job pour interview-service
  test-interview-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-interview-${{ hashFiles('interview-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Interview Service
        run: |
          cd interview-service
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-interview-service
          path: interview-service/target/surefire-reports/
          retention-days: 30

  # Job pour eureka-server
  test-eureka-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-eureka-${{ hashFiles('eureka-server/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Eureka Server
        run: |
          cd eureka-server
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-eureka-server
          path: eureka-server/target/surefire-reports/
          retention-days: 30

  # Job pour api-gateway
  test-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-gateway-${{ hashFiles('api-gateway/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test API Gateway
        run: |
          cd api-gateway
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-gateway
          path: api-gateway/target/surefire-reports/
          retention-days: 30

  # Job pour dashboard-service
  test-dashboard-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-dashboard-${{ hashFiles('dashboard-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Dashboard Service
        run: |
          cd dashboard-service
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dashboard-service
          path: dashboard-service/target/surefire-reports/
          retention-days: 30

  # Job pour notificationservice
  test-notificationservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-notification-${{ hashFiles('notificationservice/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Notification Service
        run: |
          cd notificationservice
          mvn clean test -Dfile.encoding=UTF-8
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-notificationservice
          path: notificationservice/target/surefire-reports/
          retention-days: 30

  # ==================== TESTS D'INTÉGRATION ====================

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-authentication, test-candidate-service, test-interview-service, test-eureka-server, test-api-gateway, test-dashboard-service, test-notificationservice]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run integration tests
        run: |
          mvn verify -Pintegration-tests -DskipUnitTests=true -Dfile.encoding=UTF-8 || true

  # ==================== PACKAGE ====================

  package-all:
    runs-on: ubuntu-latest
    needs: [test-authentication, test-candidate-service, test-interview-service, test-eureka-server, test-api-gateway, test-dashboard-service, test-notificationservice]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Package all services
        run: |
          services=("Authentification" "candidate-service" "interview-service" "eureka-server" "api-gateway" "dashboard-service" "notificationservice")
          for service in "${services[@]}"; do
            if [ -d "$service" ] && [ -f "$service/pom.xml" ]; then
              echo " Packaging $service"
              cd "$service"
              mvn clean package -DskipTests -Dfile.encoding=UTF-8
              cd ..
            fi
          done
      - name: Upload all JARs
        uses: actions/upload-artifact@v4
        with:
          name: all-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
          retention-days: 7

  # ==================== SONARQUBE ====================

  sonar-analysis:
    runs-on: ubuntu-latest
    needs: package-all
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=wafahajmabrouk \
            -Dsonar.projectKey=winderp-recruitment \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dfile.encoding=UTF-8
        continue-on-error: true

  # ==================== BUILD DOCKER ====================

  docker-build:
    runs-on: ubuntu-latest
    needs: [package-all, sonar-analysis]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        run: |
          services=("Authentification" "candidate-service" "interview-service" "eureka-server" "api-gateway" "dashboard-service" "notificationservice")
          for service in "${services[@]}"; do
            if [ -d "$service" ] && [ -f "$service/Dockerfile" ]; then
              echo " Building $service..."
              docker build \
                -t ${{ secrets.DOCKER_USERNAME }}/recrute-$service:${{ env.VERSION }} \
                -t ${{ secrets.DOCKER_USERNAME }}/recrute-$service:latest \
                ./$service
              docker push ${{ secrets.DOCKER_USERNAME }}/recrute-$service:${{ env.VERSION }}
              docker push ${{ secrets.DOCKER_USERNAME }}/recrute-$service:latest
              echo " Pushed $service"
            fi
          done

  # ==================== SCAN DE SÉCURITÉ ====================

  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/recrute-api-gateway:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==================== DÉPLOIEMENT ====================

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo " Deploying version: ${{ env.VERSION }}"
          echo " Deployment completed successfully!"

  # ==================== NOTIFICATIONS ====================

  notify-success:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Send success notification
        run: |
          echo "Pipeline completed successfully!"
          echo " Version: ${{ env.VERSION }}"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [test-authentication, test-candidate-service, test-interview-service, test-eureka-server, test-api-gateway, test-dashboard-service, test-notificationservice]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send failure notification
        run: |
          echo "Pipeline failed!"