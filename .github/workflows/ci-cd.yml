name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job pour le microservice authentification
  test-authentification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Test Authentification Service
        run: |
          cd Authentification
          mvn clean test -DskipTests=false

      - name: Generate test report for Authentification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authentification
          path: Authentification/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice candidate-service (ignore les erreurs)
  test-candidate-service:
    runs-on: ubuntu-latest
    continue-on-error: true  # Continue même si les tests échouent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check if candidate-service exists
        id: check_candidate
        run: |
          if [ -d "candidate-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Test Candidate Service
        if: steps.check_candidate.outputs.exists == 'true'
        run: |
          cd candidate-service
          mvn clean test -DskipTests=false || true

      - name: Generate test report for Candidate Service
        if: always() && steps.check_candidate.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-candidate-service
          path: candidate-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice interview-service (ignore les erreurs)
  test-interview-service:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check if interview-service exists
        id: check_interview
        run: |
          if [ -d "interview-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Test Interview Service
        if: steps.check_interview.outputs.exists == 'true'
        run: |
          cd interview-service
          mvn clean test -DskipTests=false || true

      - name: Generate test report for Interview Service
        if: always() && steps.check_interview.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-interview-service
          path: interview-service/target/surefire-reports/
          retention-days: 30

  # Job pour le microservice notification-service (optionnel)
  test-notification-service:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
