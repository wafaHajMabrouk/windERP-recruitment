name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ==================== TEST AUTH ====================
  test-authentification:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: |
          cd Authentification
          mvn clean test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-tests
          path: Authentification/target/surefire-reports/

  # ==================== OTHER MICROSERVICES ====================
  test-services:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        service: [
          candidate-service,
          interview-service,
          notification-service,
          dashboard-service,
          eureka-server,
          api-gateway
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test ${{ matrix.service }}
        run: |
          if [ -d "${{ matrix.service }}" ]; then
            cd ${{ matrix.service }}
            mvn clean test || true
          fi

  # ==================== PACKAGE ====================
  package-all:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-services]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build all services
        run: |
          for dir in */; do
            if [ -f "$dir/pom.xml" ]; then
              cd "$dir"
              mvn clean package -DskipTests || true
              cd ..
            fi
          done

  # ==================== SONAR ====================
  sonar-analysis:
    runs-on: ubuntu-latest
    needs: package-all
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=winderp \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ==================== DOCKER ====================
  docker-build:
    runs-on: ubuntu-latest
    needs: package-all
    if: success()

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Auth service image
        run: |
          docker build -t winderp/authentification:latest ./Authentification
          docker push winderp/authentification:latest

  # ==================== DEPLOY ====================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /app/windERP
            docker-compose pull
            docker-compose up -d --force-recreate
            docker system prune -f

  # ==================== NOTIFICATIONS ====================
  notify:
    runs-on: ubuntu-latest
    needs: [sonar-analysis, docker-build, deploy]
    if: always()

    steps:

      # ================= SLACK FIX =================
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Pipeline CI/CD terminé\n📦 Commit: ${{ github.sha }}\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ================= EMAIL FIX =================
      - name: Email notification (failure only)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline CI/CD échoué"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            ❌ Pipeline failed

            Commit: ${{ github.sha }}
            Repo: ${{ github.repository }}

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ==================== PERFORMANCE ====================
  performance-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test
        run: |
          mkdir -p tests

          cat > tests/test.js << 'EOF'
          import http from 'k6/http';
          import { check } from 'k6';

          export default function () {
            let res = http.get('http://localhost:8080/actuator/health');
            check(res, {
              'status is 200': (r) => r.status === 200
            });
          }
          EOF

          k6 run tests/test.js || true