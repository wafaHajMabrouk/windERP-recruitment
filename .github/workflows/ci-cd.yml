  # Job pour Eureka Server
  test-eureka-server:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check if EurekaServer exists
        id: check_eureka
        run: |
          if [ -d "EurekaServer" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
