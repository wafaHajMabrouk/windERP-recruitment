          fi

      - name: Test Eureka Server
        if: steps.check_eureka.outputs.exists == 'true'
        run: |
          cd EurekaServer
          mvn clean test -DskipTests=false || true

      - name: Generate test report for Eureka Server
        if: always() && steps.check_eureka.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-eureka-server
          path: EurekaServer/target/surefire-reports/
          retention-days: 30

  # Job pour API Gateway
  test-api-gateway:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
