name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Permet d'annuler les runs en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  # ==================== TESTS UNITAIRES ====================

  test-authentification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('Authentification/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Authentification Service
        run: |
          cd Authentification
          mvn clean test
      - name: Generate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authentification
          path: Authentification/target/surefire-reports/
          retention-days: 30

  test-candidate-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-candidate-${{ hashFiles('candidate-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Candidate Service
        run: |
          cd candidate-service
          mvn clean test

  test-interview-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-interview-${{ hashFiles('interview-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Interview Service
        run: |
          cd interview-service
          mvn clean test

  test-notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-notification-${{ hashFiles('notification-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Notification Service
        run: |
          cd notification-service
          mvn clean test

  test-dashboard-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-dashboard-${{ hashFiles('dashboard-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Dashboard Service
        run: |
          cd dashboard-service
          mvn clean test

  test-eureka-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-eureka-${{ hashFiles('eureka-server/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test Eureka Server
        run: |
          cd eureka-server
          mvn clean test

  test-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-gateway-${{ hashFiles('api-gateway/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Test API Gateway
        run: |
          cd api-gateway
          mvn clean test

  # ==================== TESTS D'INTÉGRATION ====================

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-candidate-service, test-interview-service, test-notification-service, test-dashboard-service, test-eureka-server, test-api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Start Docker Compose for integration tests
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 15
          docker ps
      - name: Run integration tests
        run: |
          mvn verify -Pintegration-tests -DskipUnitTests=true
      - name: Stop Docker Compose
        if: always()
        run: docker-compose -f docker-compose.test.yml down
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          retention-days: 30

  # ==================== COUVERTURE DE CODE ====================

  coverage-report:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate JaCoCo coverage report
        run: |
          mvn jacoco:report
          mvn jacoco:report-aggregate
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco-aggregate/
          retention-days: 30
      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(grep -oP 'ctr2[^<]*' target/site/jacoco-aggregate/index.html | grep -oP '[0-9]+' | head -1)
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Code coverage is $COVERAGE% which is below 80%"
            exit 1
          fi
          echo "✅ Code coverage is $COVERAGE%"

  # ==================== SONARQUBE ====================

  sonar-analysis:
    runs-on: ubuntu-latest
    needs: [coverage-report]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=wafa-hajmabrouk \
            -Dsonar.projectKey=winderp-recruitment \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=**/target/classes

  check-quality-gate:
    runs-on: ubuntu-latest
    needs: [sonar-analysis]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Attendre que l'analyse soit complète
          sleep 30
          
          # Vérifier le Quality Gate
          RESPONSE=$(curl -s -u $SONAR_TOKEN: "https://sonarcloud.io/api/qualitygates/project_status?projectKey=winderp-recruitment")
          STATUS=$(echo $RESPONSE | jq -r '.projectStatus.status')
          
          if [ "$STATUS" != "OK" ]; then
            echo "❌ Quality Gate failed: $STATUS"
            echo "Details: $RESPONSE"
            exit 1
          fi
          echo "✅ Quality Gate passed!"

  # ==================== SCAN DE SÉCURITÉ (Code) ====================

  security-scan-code:
    runs-on: ubuntu-latest
    needs: [sonar-analysis]
    steps:
      - uses: actions/checkout@v4
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 30

  # ==================== BUILD DOCKER ====================

  docker-build:
    runs-on: ubuntu-latest
    needs: [check-quality-gate, security-scan-code]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push all Docker images
        run: |
          services=("Authentification" "candidate-service" "interview-service" "notification-service" "dashboard-service" "eureka-server" "api-gateway")
          for service in "${services[@]}"; do
            if [ -d "$service" ]; then
              echo "Building $service..."
              docker build \
                --cache-from=type=local,src=/tmp/.buildx-cache \
                --cache-to=type=local,dest=/tmp/.buildx-cache-new \
                -t ${{ secrets.DOCKER_USERNAME }}/winderp-$service:${{ env.VERSION }} \
                -t ${{ secrets.DOCKER_USERNAME }}/winderp-$service:latest \
                ./$service
              docker push ${{ secrets.DOCKER_USERNAME }}/winderp-$service:${{ env.VERSION }}
              docker push ${{ secrets.DOCKER_USERNAME }}/winderp-$service:latest
            fi
          done

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ==================== SCAN DE SÉCURITÉ (Docker) ====================

  security-scan-docker:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/winderp-api-gateway:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          if grep -q '"severity":"CRITICAL"' trivy-results.sarif; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

  # ==================== DÉPLOIEMENT KUBERNETES ====================

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [security-scan-docker]
    if: github.ref == 'refs/heads/develop' && success()
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy to Staging
        run: |
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment -n staging --timeout=5m

  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && success()
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 --decode > $HOME/.kube/config

      - name: Update images in production
        run: |
          kubectl set image deployment/authentification authentification=${{ secrets.DOCKER_USERNAME }}/winderp-Authentification:${{ env.VERSION }} -n production
          kubectl set image deployment/candidate-service candidate-service=${{ secrets.DOCKER_USERNAME }}/winderp-candidate-service:${{ env.VERSION }} -n production
          kubectl set image deployment/interview-service interview-service=${{ secrets.DOCKER_USERNAME }}/winderp-interview-service:${{ env.VERSION }} -n production
          kubectl set image deployment/notification-service notification-service=${{ secrets.DOCKER_USERNAME }}/winderp-notification-service:${{ env.VERSION }} -n production
          kubectl set image deployment/dashboard-service dashboard-service=${{ secrets.DOCKER_USERNAME }}/winderp-dashboard-service:${{ env.VERSION }} -n production
          kubectl set image deployment/eureka-server eureka-server=${{ secrets.DOCKER_USERNAME }}/winderp-eureka-server:${{ env.VERSION }} -n production
          kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKER_USERNAME }}/winderp-api-gateway:${{ env.VERSION }} -n production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n production --timeout=10m

  # ==================== TESTS POST-DÉPLOIEMENT ====================

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Health check - API Gateway
        run: |
          curl -f https://api.winderp.com/actuator/health || exit 1

      - name: Health check - Eureka
        run: |
          curl -f https://eureka.winderp.com/actuator/health || exit 1

      - name: Test authentication endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.winderp.com/auth/login -d '{"username":"test","password":"test"}')
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "401" ]; then
            echo "❌ Authentication endpoint failed with status $RESPONSE"
            exit 1
          fi
          echo "✅ Smoke tests passed"

  # ==================== TESTS DE CHARGE ====================

  performance-tests:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop' && success()
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: |
          k6 run --out json=performance-results.json load-tests/spike-test.js

      - name: Check performance thresholds
        run: |
          # Vérifier que 95% des requêtes sont < 500ms
          p95=$(jq '.metrics.http_req_duration.values."p(95)"' performance-results.json)
          if (( $(echo "$p95 > 500" | bc -l) )); then
            echo "❌ Performance threshold failed: p95=$p95 ms > 500 ms"
            exit 1
          fi
          echo "✅ Performance tests passed: p95=$p95 ms"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.json
          retention-days: 30

  # ==================== NOTIFICATIONS ====================

  notify-success:
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-tests, performance-tests]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "✅ **Deployment Successful!**\nProject: windERP-recruitment\nVersion: ${{ env.VERSION }}\nEnvironment: Production\nAuthor: ${{ github.actor }}\nCommit: ${{ github.sha }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-candidate-service, test-interview-service, test-notification-service, test-dashboard-service, test-eureka-server, test-api-gateway, integration-tests, coverage-report, sonar-analysis, check-quality-gate, security-scan-code, docker-build, security-scan-docker, deploy-staging, deploy-production, smoke-tests, performance-tests]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Slack failure notification
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "❌ **Pipeline Failed!**\nProject: windERP-recruitment\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nCommit: ${{ github.sha }}\nFailed job: ${{ github.job }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}