        with:
          name: test-results-api-gateway
          path: ApiGateway/target/surefire-reports/
          retention-days: 30

  # Package tous les services (optionnel)
  package-all:
    runs-on: ubuntu-latest
    needs: [test-authentification, test-candidate-service, test-interview-service, test-notification-service, test-dashboard-service, test-eureka-server, test-api-gateway]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package all services
        run: |
          mvn clean package -DskipTests

      - name: Upload all JARs
        uses: actions/upload-artifact@v4
        with:
          name: all-services-jars
          path: |
            Authentification/target/*.jar
            candidate-service/target/*.jar
            interview-service/target/*.jar
            notification-service/target/*.jar
            dashboard-service/target/*.jar
            EurekaServer/target/*.jar
            ApiGateway/target/*.jar
          retention-days: 30