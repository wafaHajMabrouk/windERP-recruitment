spring.application.name=interview-service-test

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS WIND_ENTRETIEN\\;SET SCHEMA WIND_ENTRETIEN
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=WIND_ENTRETIEN

# Désactiver Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Désactiver Security
spring.security.enabled=false