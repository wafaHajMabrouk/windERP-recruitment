spring.application.name=interview-service
server.port=8091

# Actuator Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=

# Eureka (à adapter selon besoin)
eureka.client.service-url.defaultZone=http://winderp-eureka:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true

# Base de données (PostgreSQL)
spring.datasource.url=jdbc:postgresql://winderp-postgres:5432/winderp
spring.datasource.username=postgres
spring.datasource.password=wafawafa
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
