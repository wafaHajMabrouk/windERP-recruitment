# ==================== IDENTIFICATION PROJET ====================
sonar.projectKey=wafaHajMabrouk_windERP-recruitment
sonar.projectName=windERP-recruitment
sonar.projectVersion=1.0

# ==================== SOURCES ====================
sonar.sources=.
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/generated-sources/**,\
  **/resources/**,\
  **/config/**,\
  **/dto/**,\
  **/model/**,\
  **/exception/**

# ==================== JAVA BINARIES ====================
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.java.surefire.report=**/target/surefire-reports

# ==================== COVERAGE (DÉSACTIVÉ POUR L'INSTANT) ====================
sonar.coverage.exclusions=**/*.java
sonar.coverage.new.code.minimum=0

# ==================== DUPLICATIONS (DÉSACTIVÉES) ====================
sonar.cpd.exclusions=**/*

# ==================== IGNORER CERTAINES ISSUES ====================
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignorer les problèmes de couverture
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S125
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

# Ignorer les duplications
sonar.issue.ignore.multicriteria.e2.ruleKey=common-java:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java

# Ignorer les problèmes de sécurité mineurs
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S2259
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.java

# ==================== QUALITY GATE ====================
sonar.qualitygate.wait=false
sonar.qualitygate.ignoreFailures=true