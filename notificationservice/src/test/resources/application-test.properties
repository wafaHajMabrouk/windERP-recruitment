spring.application.name=notification-service-test

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS WIND_NOTIFICATION\;SET SCHEMA WIND_NOTIFICATION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=WIND_NOTIFICATION

# Désactiver WebSocket
spring.websocket.enabled=false

# Désactiver Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Désactiver Security
spring.security.enabled=false