spring.application.name=notification-service
server.port=8090

# ===================== DataSource =====================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:winderp}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== HikariCP =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=wind_notification

# ===================== Eureka =====================
eureka.client.enabled=true
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762/eureka}

# ===================== Swagger =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================== Security (disabled for dev) =====================
spring.security.enabled=false

# ===================== Logging =====================
logging.level.org.hibernate.SQL=${SQL_LOG:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_LOG:INFO}
logging.level.com.winderp.notification=DEBUG