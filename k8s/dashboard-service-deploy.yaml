apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: recrute
  labels:
    app: dashboard-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: dashboard-service
          image: hajmabroukwafa/recrute-dashboard-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: recrute-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: recrute-config
                  key: EUREKA_URI
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_APPLICATION_NAME
              value: "DASHBOARD-SERVICE"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: recrute-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: recrute-config
                  key: REDIS_PORT
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: recrute
  labels:
    app: dashboard-service
spec:
  selector:
    app: dashboard-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
      protocol: TCP
  type: ClusterIP