apiVersion: v1
kind: Namespace
metadata:
  name: recrute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: recrute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: recrute-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: recrute
spec:
  type: NodePort
  ports:
  - port: 8082
    targetPort: 8082
    nodePort: 30082
  selector:
    app: api-gateway
